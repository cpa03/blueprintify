<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Generate production-ready architectural blueprints for your projects in seconds. AI-powered documentation for autonomous development."
    />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="blueprint, generator, architecture, documentation, AI, developer tools"
    />
    <link rel="canonical" href="https://blueprintify.dev" />

    <!-- Open Graph / Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blueprintify.dev" />
    <meta property="og:title" content="Blueprint Generator - AI-Powered Project Architecture" />
    <meta
      property="og:description"
      content="Generate production-ready architectural blueprints for your projects in seconds. AI-powered documentation for autonomous development."
    />
    <meta property="og:image" content="https://blueprintify.dev/favicon.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Blueprint Generator" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blueprint Generator - AI-Powered Project Architecture" />
    <meta
      name="twitter:description"
      content="Generate production-ready architectural blueprints for your projects in seconds. AI-powered documentation for autonomous development."
    />
    <meta name="twitter:image" content="https://blueprintify.dev/favicon.svg" />

    <title>Blueprint Generator - AI-Powered Project Architecture</title>

    <!-- Critical CSS for LCP & first paint - prevents FOUC/CLS while main CSS loads asynchronously -->
    <style>
      html {
        background-color: #020617;
      }
      body {
        margin: 0;
        font-family:
          "Inter Fallback",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
      /* Font fallback - prevent FOUT/CLS while fonts load */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 600;
        font-display: optional;
        src: local("Inter");
      }
      @font-face {
        font-family: "Inter Fallback";
        src: local("system-ui"), local("Arial"), local("sans-serif");
        size-adjust: 88.5%;
        ascent-override: 91%;
        descent-override: 24%;
        line-gap-override: 8%;
      }
      /* Hero LCP text styles */
      .text-4xl {
        font-size: 2.25rem;
        line-height: 2.5rem;
      }
      .font-bold {
        font-weight: 700;
      }
      .text-white {
        color: #ffffff;
      }
      .mb-4 {
        margin-bottom: 1rem;
      }
      .mb-12 {
        margin-bottom: 3rem;
      }
      .leading-tight {
        line-height: 1.25;
      }
      .text-lg {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      .text-center {
        text-align: center;
      }
      .text-dark-400 {
        color: #b8c0cc;
      }
      .text-gradient {
        background: linear-gradient(135deg, #818cf8, #8b5cf6, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .max-w-2xl {
        max-width: 42rem;
      }
      .mx-auto {
        margin-left: auto;
        margin-right: auto;
      }
      /* Hero entrance animations */
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }
      /* Prevent layout shift from font loading */
      .font-sans {
        font-family:
          "Inter Fallback",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      /* UI component critical styles */
      .glass-card {
        background: rgba(26, 26, 30, 0.6);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(77, 77, 83, 0.5);
        border-radius: 1rem;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
        font-weight: 500;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease-out;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .text-dark-500 {
        color: #9ca3af;
      }
      @keyframes slide-up {
        0% {
          transform: translateY(10px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      /* Subtle pulse animation for skeleton logo — gives the initial
         loading state a gentle "alive" feel while React hydrates.
         A soft scale + glow that fades once per cycle, matching the
         app's animated design language.
         Flexy says: Values must stay in sync with @blueprint/shared SKELETON_DEFAULTS! */
      @keyframes skeleton-pulse {
        0%,
        100% {
          transform: scale(var(--skeleton-scale-rest, 1));
          opacity: var(--skeleton-opacity-rest, 0.9);
        }
        50% {
          transform: scale(var(--skeleton-scale-peak, 1.04));
          opacity: var(--skeleton-opacity-peak, 1);
          filter: brightness(var(--skeleton-brightness-peak, 1.15));
        }
      }
      /* Skeleton exit animation — auto-starts after 2s delay, fades out
         in 0.3s, then stays hidden. No JS timer or rAF needed on the
         critical rendering path — pure CSS animation. */
      @keyframes skeleton-exit {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>

    <!-- Preconnect + DNS prefetch for critical origins -->
    <!-- Note: preconnect implies dns-prefetch, so only add dns-prefetch for origins without full preconnect -->
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin fetchpriority="high" />
    <!-- Note: Vercel Analytics preconnect intentionally omitted - analytics is lazy-loaded,
         so the preconnect would be unused on initial page load and waste connections. -->

    <!-- Async Inter font - Preload + media="print" onload trick for non-blocking CSS
         The preload tells the browser to start fetching the stylesheet early (before the
         CSSOM is constructed), while media="print" onload prevents it from blocking render.
         @font-face with local("Inter") + size-adjusted fallback in critical CSS handles
         the FOUT/CLS during the brief async load window. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="
        this.media = 'all';
        this.onload = null;
      "
    />

    <!-- JetBrains Mono (code font) - async non-blocking load, not needed for initial render -->
    <link
      id="font-mono"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=optional"
      media="print"
      onload="
        this.media = 'all';
        this.onload = null;
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=optional"
      />
    </noscript>
  </head>
  <body>
    <!-- Skeleton header bar - fixed at top fades out after React mounts.
           Hero content is directly in #root so the LCP element is visible immediately,
           not blocked by an overlay skeleton. -->
    <div
      id="skeleton-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: #020617;
        animation: skeleton-exit 0.3s ease-out 2s forwards;
        pointer-events: none;
      "
    >
      <header style="border-bottom: 1px solid #1e293b; background: #020617; height: 65px">
        <div
          style="
            max-width: 80rem;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div style="display: flex; align-items: center; gap: 0.75rem">
            <div
              style="
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 0.75rem;
                background: linear-gradient(135deg, #6366f1, #8b5cf6);
                animation: skeleton-pulse 2.5s ease-in-out infinite;
              "
            ></div>
            <div>
              <div style="font-weight: 700; font-size: 1.25rem; color: #fff">
                Blueprint Generator
              </div>
            </div>
          </div>
        </div>
      </header>
    </div>

    <div id="root" style="position: relative; min-height: 100vh">
      <!-- LCP Critical Hero Content - visible immediately, not hidden behind skeleton overlay.
           React will hydrate and replace this with the same content, so there is no flash.
           Classes match the Tailwind output of App.tsx hero section for seamless transition. -->
      <div
        class="text-center mb-12"
        style="
          padding-top: 5rem;
          padding-left: 1rem;
          padding-right: 1rem;
          max-width: 80rem;
          margin-left: auto;
          margin-right: auto;
        "
      >
        <div style="padding-top: 2rem">
          <h1 class="text-4xl sm:text-5xl font-bold text-white mb-4 leading-tight">
            From
            <span class="text-gradient">Idea</span>
            to
            <span class="text-gradient">Blueprint</span>
            in Seconds
          </h1>
          <p class="text-lg text-dark-400 max-w-2xl mx-auto">
            Generate production-ready architectural documentation for your projects.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
