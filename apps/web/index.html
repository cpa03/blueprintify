<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Generate production-ready architectural blueprints for your projects in seconds. AI-powered documentation for autonomous development."
    />
    <meta
      name="keywords"
      content="blueprint, generator, architecture, documentation, AI, developer tools"
    />
    <title>Blueprint Generator - AI-Powered Project Architecture</title>
    
    <!-- DNS Prefetch and Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS for LCP -->
    <style>
      /* Critical CSS - Above the fold content */
      html {
        background-color: #020617;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
      }
      /* Ensure content is visible immediately for LCP */
      #root {
        min-height: 100vh;
      }
      /* Preload critical font */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: local('Inter');
      }
    </style>
    
    <!-- Preload Fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; border-bottom: 1px solid #1e293b; background-color: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px);">
          <div style="max-width: 80rem; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span style="font-size: 1.5rem;">📐</span>
              <span style="font-weight: 600; font-size: 1.25rem;">Blueprint Generator</span>
            </div>
          </div>
        </header>
        <main style="padding-top: 5rem; flex: 1;">
          <div style="max-width: 80rem; margin: 0 auto; padding: 2rem 1rem;">
            <div style="text-align: center; margin-bottom: 3rem;">
              <h1 style="font-size: 2.25rem; font-weight: 700; color: #ffffff; margin-bottom: 1rem; line-height: 1.2;">
                From <span style="background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Idea</span> 
                to <span style="background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Blueprint</span> 
                in Seconds
              </h1>
              <p style="font-size: 1.125rem; color: #94a3b8; max-width: 42rem; margin: 0 auto; line-height: 1.75;">
                Generate production-ready architectural documentation for your projects. Powered by AI, designed for autonomous development.
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
