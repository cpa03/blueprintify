<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Generate production-ready architectural blueprints for your projects in seconds. AI-powered documentation for autonomous development."
    />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="blueprint, generator, architecture, documentation, AI, developer tools"
    />
    <link rel="canonical" href="https://blueprintify.dev" />
    <title>Blueprint Generator - AI-Powered Project Architecture</title>

    <!-- Critical CSS for LCP -->
    <style>
      /* Critical CSS - Above the fold content */
      html {
        background-color: #020617;
      }
      body {
        margin: 0;
        font-family:
          "Inter Fallback",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
      }
      /* Ensure content is visible immediately for LCP */
      #root {
        min-height: 100vh;
      }
      /* Preload critical font */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 600;
        font-display: optional;
        src: local("Inter");
      }
      /* Size-adjusted fallback using system-ui to match Inter metrics - prevents FOUT CLS */
      @font-face {
        font-family: "Inter Fallback";
        src: local("system-ui"), local("Arial"), local("sans-serif");
        size-adjust: 88.5%;
        ascent-override: 91%;
        descent-override: 24%;
        line-gap-override: 8%;
      }
      /* LCP critical text styles - prevent FOUC while CSS loads */
      .text-lg {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      .max-w-2xl {
        max-width: 42rem;
      }
      .mx-auto {
        margin-left: auto;
        margin-right: auto;
      }
      .text-center {
        text-align: center;
      }
      .mb-3 {
        margin-bottom: 0.75rem;
      }
      .text-4xl {
        font-size: 2.25rem;
        line-height: 2.5rem;
      }
      .font-bold {
        font-weight: 700;
      }
      .text-white {
        color: #ffffff;
      }
      .mb-4 {
        margin-bottom: 1rem;
      }
      .leading-tight {
        line-height: 1.25;
      }
      /* Prevent layout shift from font loading - match Tailwind font-sans stack */
      .font-sans {
        font-family:
          "Inter Fallback",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      /* Additional hero section critical styles */
      .glass-card {
        background: rgba(26, 26, 30, 0.6);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(77, 77, 83, 0.5);
        border-radius: 1rem;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
        font-weight: 500;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease-out;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .input-field {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(67, 67, 72, 0.5);
        border: 1px solid rgba(77, 77, 83, 1);
        border-radius: 0.75rem;
        color: #fff;
        transition: all 0.2s;
      }
      .input-field::placeholder {
        color: #5a5a62;
      }
      .text-dark-400 {
        color: #b8c0cc;
      }
      .text-dark-500 {
        color: #9ca3af;
      }
      .text-gradient {
        background: linear-gradient(135deg, #818cf8, #8b5cf6, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>

    <!-- DNS prefetch and preconnect for critical origins -->
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin fetchpriority="high" />
    <link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin />

    <!-- Preload Inter font for LCP hero text (weight 500/600 used in headings) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      fetchpriority="high"
    />

    <!-- Async Inter font (body text) - media="print" onload trick for non-blocking CSS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional"
      media="print"
      onload="
        this.media = 'all';
        this.onload = null;
      "
    />

    <!-- JetBrains Mono (code font) - async non-blocking load, not needed for initial render -->
    <link
      id="font-mono"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=optional"
      media="print"
      onload="
        this.media = 'all';
        this.onload = null;
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=optional"
      />
    </noscript>
  </head>
  <body>
    <div id="root" style="position: relative">
      <!-- Critical LCP Skeleton - minimal for fast parse, covers viewport only -->
      <div
        id="skeleton-loader"
        fetchpriority="high"
        style="
          position: absolute;
          inset: 0;
          z-index: 9999;
          background: #020617;
          color: #f8fafc;
          opacity: 1;
          transition: opacity 0.3s ease-out;
          pointer-events: none;
          contain: strict;
        "
      >
        <header
          style="
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            border-bottom: 1px solid #1e293b;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            height: 65px;
          "
        >
          <div
            style="
              max-width: 80rem;
              margin: 0 auto;
              padding: 1rem 1.5rem;
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <div style="display: flex; align-items: center; gap: 0.75rem">
              <div
                style="
                  width: 2.5rem;
                  height: 2.5rem;
                  border-radius: 0.75rem;
                  background: linear-gradient(135deg, #6366f1, #8b5cf6);
                "
              ></div>
              <div>
                <div style="font-weight: 700; font-size: 1.25rem; color: #fff">
                  Blueprint Generator
                </div>
              </div>
            </div>
          </div>
        </header>
        <main style="padding-top: 5rem; flex: 1">
          <div style="max-width: 80rem; margin: 0 auto; padding: 2rem 1rem">
            <!-- LCP Critical Element -->
            <div
              style="text-align: center; margin-bottom: 3rem; min-height: 200px"
              fetchpriority="high"
            >
              <h1
                style="
                  font-size: 2.25rem;
                  font-weight: 700;
                  color: #fff;
                  margin-bottom: 1rem;
                  line-height: 1.2;
                "
              >
                From
                <span
                  style="
                    background: linear-gradient(135deg, #6366f1, #8b5cf6);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                  "
                  >Idea</span
                >
                to
                <span
                  style="
                    background: linear-gradient(135deg, #6366f1, #ec4899);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                  "
                  >Blueprint</span
                >
                in Seconds
              </h1>
              <p style="font-size: 1.125rem; color: #94a3b8; max-width: 42rem; margin: 0 auto">
                Generate production-ready architectural documentation for your projects.
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
