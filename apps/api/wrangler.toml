# Cloudflare Workers Configuration - Optimized for Cloudflare Free Tier
name = "blueprintify"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

# workers.dev subdomain enabled (Free Tier doesn't require custom domain setup)
workers_dev = true

# Preserve environment variables during deployments
keep_vars = true

# Cloudflare Workers AI binding (Free Tier: 10k neurons/day)
[ai]
binding = "AI"

# Default environment: production (top-level)
[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "*"

# KV namespaces for caching (Free Tier: 1GB storage, 100k reads/day, 1k writes/day)
[[kv_namespaces]]
binding = "CACHE"
id = "c55ed3885e8440338c5066ea4f310cc3"

# D1 database binding (Free Tier: 5GB storage, 5M reads/day, 100k writes/day)
[[d1_databases]]
binding = "DB"
database_name = "blueprint-db"
database_id = "49d9b895-9f4e-4b91-989c-8bfeb0bc2d50"

# Cloudflare Native Rate Limiting (Free Tier: included, no extra cost)
[[ratelimits]]
name = "STRICT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "STANDARD_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "LENIENT_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 120
period = 60

# Observability logs (Free Tier: included, no extra cost)
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.5

# ============================================================
# Staging environment
# ============================================================
[env.staging]
name = "blueprintify-staging"
workers_dev = true
vars = { ENVIRONMENT = "staging", CORS_ORIGIN = "*" }

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "17d72197156e4705b6850e731883d6fb"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "blueprint-db-staging"
database_id = "7c22c4e8-3451-4cf5-945c-92eb1fb466b4"

[[env.staging.ratelimits]]
name = "STRICT_RATE_LIMITER"
namespace_id = "3001"
[env.staging.ratelimits.simple]
limit = 10
period = 60

[[env.staging.ratelimits]]
name = "STANDARD_RATE_LIMITER"
namespace_id = "3002"
[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.ratelimits]]
name = "LENIENT_RATE_LIMITER"
namespace_id = "3003"
[env.staging.ratelimits.simple]
limit = 120
period = 60
