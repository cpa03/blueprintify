name = "blueprint-generator-api"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]
tsconfig = "./tsconfig.json"

# Preserve environment variables during deployments
# https://developers.cloudflare.com/workers/configuration/migrating-to-module-workers/#settings-inheritance
keep_vars = true

# Production debugging: Upload source maps for readable stack traces
# https://developers.cloudflare.com/workers/observability/source-maps
upload_source_maps = true

# Smart Placement - optimizes worker placement based on traffic patterns
# Takes up to 15 minutes to analyze after deployment
[placement]
mode = "smart"

# Environment-specific configurations
[env.production]
name = "blueprint-generator-api-prod"
workers_dev = false
logpush = true
minify = true
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "api.blueprintify.dev/*", zone_name = "blueprintify.dev" }
]

[env.staging]
name = "blueprint-generator-api-staging"
workers_dev = false
logpush = true
minify = true
vars = { ENVIRONMENT = "staging" }
routes = [
  { pattern = "api-staging.blueprintify.dev/*", zone_name = "blueprintify.dev" }
]

# Development configuration (default)
[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:3000"
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW = "60"

# Production secrets (set via wrangler secret put)
# [env.production.secrets]
# OPENAI_API_KEY = ""
# DATABASE_URL = ""
# SENTRY_DSN = ""

# Staging secrets (set via wrangler secret put --env staging)  
# [env.staging.secrets]
# OPENAI_API_KEY = ""
# DATABASE_URL = ""
# SENTRY_DSN = ""

# KV namespaces for caching
[[kv_namespaces]]
binding = "CACHE"
id = "cache_kv_namespace_id"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "production_cache_kv_id"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "staging_cache_kv_id"

# D1 database bindings
[[d1_databases]]
binding = "DB"
database_name = "blueprint-db"
database_id = "local_database_id"

[[env.production.d1_databases]]
binding = "DB"
database_name = "blueprint-db-prod"
database_id = "production_database_id"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "blueprint-db-staging"
database_id = "staging_database_id"

# Queue for background processing
[[queues.producers]]
binding = "BACKGROUND_QUEUE"
queue = "background-processing"

[[queues.consumers]]
queue = "background-processing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
retry_delay = 60

# Limits and configuration
[limits]
cpu_ms = 50000

# Observability: Traces and Logs for production monitoring
# https://developers.cloudflare.com/workers/observability/traces
[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.5

# Cloudflare Native Rate Limiting
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit
[[ratelimits]]
name = "STRICT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "STANDARD_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "LENIENT_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 120
period = 60
