name: on pull
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
concurrency:
  group: global
  cancel-in-progress: false

jobs:
  analyze:
    name: on pull
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      
    steps:
      - name: Wait in Queue
        uses: softprops/turnstyle@v2
        with:
          poll-interval-seconds: 30
          same-branch-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Branch Management
        run: |
          git fetch --all
          if git branch -r | grep "origin/agent-workspace"; then
            git checkout agent-workspace
            git pull origin agent-workspace
          else
            git checkout -b agent-workspace
          fi
          git merge origin/develop --no-edit || echo "Merge conflict or already up to date"

      - name: Install Dependencies
        continue-on-error: true
        run: npm ci

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: On Pull
        run: |
          opencode run /ulw-loop "$(cat <<'PROMPT'
          run .opencode/command/on-pull.md
          PROMPT
          )" \
            --model opencode/kimi-k2.5-free \
            --share false \

      - name: iterate1
        run: |
          opencode run /ralph-loop "$(cat <<'PROMPT'
            ## PHASE 1
            # You are  **OpenX**, repository automation specialist using OpenCode CLI. You work on current workspace (project level). Follow Stict Phase below:
            ## PHASE 1
            Step:
            1. Check if 'opencode.json' and '.opencode/oh-my-opencode.json' exist, create if not exist. (analyze https://github.com/code-yeongyu/oh-my-opencode.git before creating).
                - configure all agents using models: opencode/glm-4.7-free, opencode/kimi-k2.5-free or opencode/minimax-m2.1-free
            2. Fetch and follow instructions from https://raw.githubusercontent.com/obra/superpowers/refs/heads/main/.opencode/INSTALL.md
            3. Install and configure oh-my-opencode by following the instructions here: https://raw.githubusercontent.com/code-yeongyu/oh-my-opencode/refs/heads/master/docs/guide/installation.md
            4. Check and Manage the following repositories as supplements to current project. Ensure no conflict or redundant. if already implemented, skip it. Think harder, plan carefully, must be in harmony.:
                - https://github.com/vasilyu1983/AI-Agents-public#frameworks~shared-skills~skills~git-commit-message.git
                - https://github.com/asgeirtj/system_prompts_leaks.git
                - https://github.com/OpenBMB/UltraRAG.git
            5. Setup agent skill for opencode cli (.opencode/skill on workspace. copy to project configuration folder if skill installed at global configuration folder), skip if already implemented.
                - https://github.com/sulhi-sabil/agent-skill/
            6. Remove temporary and unused file/folder. 
            7. Review and **self reflection**. fix/optimize your work if needed
            8. Verify if all configuration working and optimized. your task fail if not verified

            ## PHASE 2
            Step:
            1.  **Push**:
            - Commit changes.
            - Push to `agent-workspace`: `git push origin agent-workspace`. Create if no exist.
            2.  **PR**:
            - Create or update Pull Request from `agent-workspace` to `main`.
            - Wait and monitor check if check fail fix until all check pass
            3. 	**Merge**
            - If all check pass, no conflict with 'main', merge or set to automerge
          PROMPT
          )" \
            --model opencode/kimi-k2.5-free \
            --share false \




